<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>Murmuration — Play</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Phone (art direction §12): an instrument, not a form. 390 px reference, 20 px side padding, primary action in the bottom 60 %.
         Tokens: lib/chrome/ui.css; keys, rail, rating, scores: lib/chrome/instrument.css (both imported by main.ts). */
      html { height: 100%; }
      body { min-height: 100%; overscroll-behavior: none; }
      #app { position: relative; min-height: 100vh; min-height: 100dvh; max-width: 480px; margin: 0 auto; padding: 16px 20px calc(24px + env(safe-area-inset-bottom)); }

      /* Join and lobby: the flock lives in a full-bleed band at the top; the brand sits on its lower edge */
      .flock { display: block; flex: none; width: calc(100% + 40px); height: 30vh; height: 30dvh; margin: -16px -20px -56px; pointer-events: none; }
      .brand { position: relative; }
      .pitch { font: 600 26px/1.15 var(--display); letter-spacing: -0.01em; color: var(--text-primary); text-wrap: balance; }
      .code { display: inline-flex; align-items: center; gap: 10px; font: 700 15px/1 var(--display); letter-spacing: 0.24em; color: var(--text-secondary); }
      .code b { color: var(--text-primary); }

      /* Energy dial (Spectators, live) */
      input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 56px; margin: 0; background: transparent; }
      input[type="range"]:disabled { opacity: 0.5; }
      input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--hairline); }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; margin-top: -15px; border: 0; border-radius: 50%; background: var(--accent); }
      input[type="range"]::-moz-range-track { height: 2px; background: var(--hairline); }
      input[type="range"]::-moz-range-thumb { width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--accent); }
    </style>
  </head>
  <body>
    <div id="app" class="instrument"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
