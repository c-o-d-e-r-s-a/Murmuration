<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Murmuration</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1218;
        --fg: #e8eef6;
        --muted: #9aa8b8;
        --line: #243041;
        --accent: #7eb8ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(900px 500px at 20% 0%, #1a2740 0%, transparent 55%),
          radial-gradient(700px 400px at 90% 80%, #182033 0%, transparent 50%),
          var(--bg);
        color: var(--fg);
      }
      main {
        width: min(28rem, calc(100% - 2rem));
        padding: 1.75rem 1.5rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(14, 18, 24, 0.72);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.75rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.45;
      }
      nav {
        display: grid;
        gap: 0.65rem;
      }
      a {
        display: block;
        padding: 0.85rem 1rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--fg);
        text-decoration: none;
        background: rgba(255, 255, 255, 0.03);
      }
      a:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      a span {
        display: block;
        margin-top: 0.2rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Murmuration</h1>
      <p>Pick a surface. Phones should open Play (usually via the host QR).</p>
      <nav>
        <a href="/host/">Host <span>Create a session and show the QR</span></a>
        <a href="/screen/">Screen <span>Big-screen artwork</span></a>
        <a href="/play/">Play <span>Phone join / dial / rate</span></a>
      </nav>
    </main>
  </body>
</html>
