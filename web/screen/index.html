<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murmuration — Screen</title>
    <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Art direction §1–§3, §6: design at 1920x1080, every size in vw so 1280x720 keeps the composition (1vw = 19.2px @1080p). Fonts self-hosted (venue WiFi). */
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("/fonts/bricolage-grotesque-latin.woff2") format("woff2");
        font-weight: 200 800;
        font-stretch: 75% 100%;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("/fonts/instrument-sans-latin.woff2") format("woff2");
        font-weight: 400 700;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --ink-0: #0b0b0f;
        --surface-1: #15151c;
        --hairline: #3a3a48;
        --text-primary: #f4efe6;
        --text-secondary: #b8b2a7;
        --accent: #ffb45a;
        --urgent: #ff6b5e;
        --role-palette: #e88a6a;
        --role-form: #7fb3d5;
        --role-motion: #b48eeb;
        --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
        --text: "Instrument Sans", system-ui, sans-serif;
        --fs-h2: clamp(30px, 2.5vw, 68px);
        --fs-body: clamp(24px, 1.875vw, 50px);
        --fs-label: clamp(24px, 1.46vw, 40px);
      }
      html, body { margin: 0; height: 100%; background: var(--ink-0); color: var(--text-primary); font: 500 var(--fs-body)/1.3 var(--text); overflow: hidden; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { position: absolute; transition: opacity 300ms ease-in; opacity: 0; }
      #ui[data-s="lobby"] .lobby,
      #ui[data-s="live"] .live,
      #ui[data-s="rating"] .card, #ui[data-s="rating"] .judging,
      #ui[data-s="reveal"] .card, #ui[data-s="reveal"] .credits { opacity: 1; transition-duration: 480ms; }
      #ui[data-s="live"] .credits { opacity: 1; }
      .small { font: 600 var(--fs-label)/1.3 var(--text); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); }

      /* lobby: QR card left 40%, info right 60%; both on panels because the artwork runs behind them (§11 item 8) */
      .panel { background: rgba(21, 21, 28, 0.72); border: 1px solid var(--hairline); border-radius: 12px; box-sizing: border-box; }
      .lobby-card { left: 5vw; top: 5vh; bottom: 5vh; width: 34vw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25vw; }
      .qr { background: #f4efe6; padding: 1.667vw; }
      .qr canvas { display: block; }
      .code { font: 700 var(--fs-h2)/1 var(--display); letter-spacing: 0.12em; }
      .lobby-info { left: 45vw; right: 5vw; top: 5vh; bottom: 5vh; padding: 0 2.5vw; display: flex; flex-direction: column; justify-content: center; gap: 1.667vw; }
      .wordmark { font: 700 clamp(72px, 6.25vw, 168px)/1 var(--display); }
      .dials { display: flex; flex-direction: column; gap: 0.833vw; }
      .dial, .badge { display: flex; align-items: center; gap: 0.833vw; }
      .dot { width: 1.3vw; height: 1.3vw; border-radius: 50%; flex: none; }
      .dial .open { color: var(--text-secondary); }

      /* live: top bar + bottom strip */
      .bar { left: 5vw; right: 5vw; top: 5vh; display: flex; justify-content: space-between; align-items: center; gap: 1.667vw; min-height: 5.83vw; padding: 0 1.25vw; background: rgba(21, 21, 28, 0.72); border: 1px solid var(--hairline); }
      .prompt { max-width: 60%; font: 600 clamp(30px, 2.6vw, 70px)/1.15 var(--display); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .count { font: 700 clamp(72px, 6.25vw, 168px)/1 var(--display); font-variant-numeric: tabular-nums; color: var(--accent); transition: color 600ms; transform-origin: right center; }
      /* §6.0: last 10 s eases to --urgent and pulses at 1 Hz, so colour is not the only signal */
      .count.urgent { color: var(--urgent); animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(1.04); opacity: 0.7; } }
      /* Beat 1: countdown holds on 0:00 for 200 ms, then the live chrome leaves over 300 ms --ease-exit */
      #ui[data-s="locked"] .live, #ui[data-s="locked"] .credits { transition: opacity 300ms cubic-bezier(0.4, 0, 1, 1) 200ms; }
      .credits { left: 5vw; right: 5vw; bottom: 5vh; z-index: 1; display: flex; align-items: center; gap: 1.25vw; min-height: 5vw; box-sizing: border-box; padding: 0.833vw 1.25vw; background: rgba(21, 21, 28, 0.72); border: 1px solid var(--hairline); font: 600 var(--fs-label)/1.3 var(--text); }
      .credits:empty { display: none; }

      /* locked/rating/reveal: bottom scrim + title card (reveal: compressed to the top) */
      .scrim { left: 0; right: 0; bottom: 0; height: 40vh; background: linear-gradient(to top, rgba(11, 11, 15, 0.85), transparent); }
      #ui[data-s="rating"] .scrim, #ui[data-s="reveal"] .scrim { opacity: 1; }
      .card { left: 5vw; right: 5vw; bottom: 12vh; transition: all 480ms cubic-bezier(0.2, 0, 0, 1), opacity 480ms; }
      .card .title { font: 700 clamp(48px, 4.4vw, 120px)/1.05 var(--display); max-width: 80%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; border-top: 1px solid var(--hairline); padding-top: 0.833vw; margin-top: 0.625vw; }
      #ui[data-s="reveal"] .card { bottom: auto; top: 5vh; }
      #ui[data-s="reveal"] .card .title { font-size: var(--fs-h2); }
      /* Beat 4: scrim, title card and caption arrive 300 ms after the bloom (1800 ms after lock) */
      #ui[data-s="rating"] .scrim, #ui[data-s="rating"] .card, #ui[data-s="rating"] .judging { transition-duration: 480ms; transition-delay: 300ms; }
      .judging { right: 5vw; top: 5vh; font: 600 var(--fs-h2)/1 var(--display); display: flex; align-items: center; gap: 1.25vw; padding: 0.833vw 1.25vw; }
      .judging i { width: 0.7vw; height: 0.7vw; border-radius: 50%; background: var(--text-primary); animation: breathe 2s ease-in-out infinite; }
      .judging i:nth-child(2) { animation-delay: 0.25s; }
      .judging i:nth-child(3) { animation-delay: 0.5s; }
      @keyframes breathe { 50% { opacity: 0.2; } } /* 0.5 Hz, no spinners (§6.8) */

      /* P1-4: rating rail (§6 Beat 5), scoreboard (Beats 6, 7), verdict text (Beat 8; hidden until a script exists), credits delay (Beat 9) */
      #stage { transition: transform 480ms cubic-bezier(0.2, 0, 0, 1); transform-origin: 3vw 55%; }
      #stage.reveal { transform: scale(0.6); }
      .rail { left: 0; right: 0; bottom: 0; height: 4px; background: var(--accent); transform-origin: left; transition: opacity 300ms; }
      #ui[data-s="rating"] .rail { opacity: 1; }
      #ui[data-s="reveal"] .card { right: 45vw; }
      #ui[data-s="reveal"] .card .title { max-width: 100%; }
      #ui[data-s="reveal"] .credits { transition-delay: 2600ms; }
      #ui.instant .credits { transition-delay: 0s; }
      .board { right: 5vw; top: 5vh; width: 36vw; bottom: 16vh; padding: 1.25vw; background: rgba(21, 21, 28, 0.72); border: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 0.833vw; box-sizing: border-box; }
      #ui[data-s="reveal"] .board { opacity: 1; }
      .sc { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0 0.833vw; opacity: 0; }
      .sc .num, .combined .num { font: 700 clamp(64px, 5.8vw, 156px)/1 var(--display); font-variant-numeric: tabular-nums; }
      .sc .cap { grid-column: 1 / 3; color: var(--text-secondary); font-size: var(--fs-body); }
      .combined { position: relative; isolation: isolate; text-align: center; opacity: 0; }
      .combined .num { font-size: clamp(120px, 10.4vw, 280px); font-weight: 800; color: var(--accent); }
      /* Beat 7: second, smaller bloom behind the combined number (0 -> 0.3 -> 0 over 600 ms) */
      .combined::before { content: ""; position: absolute; inset: -30% -10%; z-index: -1; opacity: 0; pointer-events: none; background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 35%, var(--text-primary)), transparent); }
      #ui[data-s="reveal"] .combined::before { animation: bloom2 600ms 1600ms both; }
      #ui.instant .combined::before { animation: none; }
      @keyframes bloom2 { 50% { opacity: 0.3; } 100% { opacity: 0; } }
      /* Sits at the right end of the credits strip; #ui ignores pointer events, the button must not */
      .play-verdict { position: fixed; right: 6.25vw; bottom: calc(5vh + 0.833vw); z-index: 5; pointer-events: auto; padding: 0.625vw 1.25vw; font: inherit; font-size: var(--fs-label); color: var(--text-primary); background: var(--ink-0); border: 1px solid var(--text-primary); border-radius: 999px; cursor: pointer; }
      .play-verdict[hidden] { display: none; }
      #ui[data-s="reveal"] .sc { animation: stamp 320ms cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: calc(var(--i) * 400ms); }
      #ui[data-s="reveal"] .combined { animation: slam 260ms cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 1600ms; }
      #ui.instant .sc, #ui.instant .combined { animation-duration: 1ms; animation-delay: 0s; }
      @keyframes stamp { from { opacity: 0; transform: scale(1.15); } to { opacity: 1; transform: none; } }
      @keyframes slam { from { opacity: 0; transform: scale(1.3); } to { opacity: 1; transform: none; } }
      /* Beat 9: credit badges slide in from the left, 120 ms stagger, as the strip returns */
      #ui[data-s="reveal"] .credits .dial { animation: slidein 480ms cubic-bezier(0.2, 0, 0, 1) both; animation-delay: calc(2600ms + var(--i) * 120ms); }
      #ui.instant .credits .dial { animation: none; }
      @keyframes slidein { from { opacity: 0; transform: translateX(-2.5vw); } }

      #msg { position: fixed; left: 5vw; top: 5vh; font: 600 var(--fs-h2) var(--display); }

      /* P1-6 (art direction §6 Beats 3-4): one radial bloom (single event, peak 0.55, 900 ms) + seeded dot burst; title card slides up 48 px */
      #bloom, #burst { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
      #bloom { background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent) 35%, var(--text-primary)) 0%, transparent 70%); }
      #bloom.go { animation: bloom 900ms both; }
      @keyframes bloom { 0% { opacity: 0; transform: scale(0); } 35% { opacity: 0.55; } 100% { opacity: 0; transform: scale(2.8); } }
      #burst { width: 100%; height: 100%; opacity: 1; }
      /* P1-7 part 2 (Beat 10): artwork eases down to 0.3 (transform only), Reimagined fades in beside it over --dur-cinematic */
      #stage.reveal.rx { transform: scale(0.3); transition-duration: 900ms; }
      .reimagined { left: 33vw; top: 53.5vh; width: 26vw; margin-top: -7.3vw; transition: opacity 900ms ease-in; }
      #ui.rx[data-s="reveal"] .reimagined { opacity: 1; transition-duration: 900ms; }
      .reimagined img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
      .reimagined .small {
        display: block;
        margin-top: 0.8vw;
        font-size: clamp(13px, 1.05vw, 18px);
        letter-spacing: 0.1em;
        line-height: 1;
        white-space: nowrap;
        text-align: center;
      }
      #ui[data-s="locked"] .card { transform: translateY(48px); }
      #ui[data-s="rating"] .card { transform: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui" data-s="">
      <div class="lobby lobby-card panel">
        <div class="qr"></div>
        <div class="code"></div>
        <div class="url"></div>
      </div>
      <div class="lobby lobby-info panel">
        <div class="wordmark">Murmuration</div>
        <div class="scene-title small"></div>
        <div class="joined"></div>
        <div class="dials"></div>
      </div>
      <div class="live bar"><div class="prompt"></div><div class="count">0:00</div></div>
      <div class="credits"></div>
      <div class="scrim"></div>
      <div class="card"><div class="small scene-card"></div><div class="title"></div></div>
      <div class="rail"></div>
      <div class="reimagined"><img alt="" /><span class="small">Reimagined with Gemini</span></div>
      <div class="board">
        <div class="sc" style="--i: 0" data-k="author"><span class="small">Author's Taste</span><span class="num">—</span><span class="cap"></span></div>
        <div class="sc" style="--i: 1" data-k="ai"><span class="small">AI Match</span><span class="num">—</span><span class="cap"></span></div>
        <div class="sc" style="--i: 2" data-k="audience"><span class="small">Audience</span><span class="num">—</span><span class="cap"></span></div>
        <div class="combined" data-k="combined"><div class="num">—</div><div class="small">Combined</div></div>
        <button class="play-verdict" hidden>Play verdict</button>
      </div>
      <div class="judging panel">The room is judging <i></i><i></i><i></i></div>
    </div>
    <div id="bloom"></div>
    <canvas id="burst"></canvas>
    <div id="msg"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
