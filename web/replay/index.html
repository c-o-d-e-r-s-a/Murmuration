<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murmuration — Replay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Art direction §3.1 (/replay uses the /screen type scale), minimal chrome: prompt + clock while live, scores at the end. */
      :root {
        --ink-0: #0b0b0f;
        --hairline: #3a3a48;
        --text-primary: #f4efe6;
        --text-secondary: #b8b2a7;
        --accent: #ffb45a;
        --role-palette: #e88a6a;
        --role-form: #7fb3d5;
        --role-motion: #b48eeb;
        --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
        --text: "Instrument Sans", system-ui, sans-serif;
        --fs-h2: clamp(30px, 2.5vw, 68px);
        --fs-body: clamp(24px, 1.875vw, 50px);
        --fs-label: clamp(24px, 1.46vw, 40px);
      }
      html, body { margin: 0; height: 100%; background: var(--ink-0); color: var(--text-primary); font: 500 var(--fs-body)/1.3 var(--text); overflow: hidden; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; transition: transform 480ms cubic-bezier(0.2, 0, 0, 1); transform-origin: 3vw 55%; }
      #stage.reveal { transform: scale(0.6); }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { position: absolute; opacity: 0; transition: opacity 480ms ease-in; }
      #ui[data-s="live"] .bar, #ui[data-s="live"] .credits, #ui[data-s="reveal"] .credits, #ui[data-s="reveal"] .card, #ui[data-s="reveal"] .board { opacity: 1; }
      .small { font: 600 var(--fs-label)/1.3 var(--text); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); }

      .bar { left: 5vw; right: 5vw; top: 5vh; display: flex; justify-content: space-between; align-items: center; gap: 2vw; min-height: 5.83vw; padding: 0 1.5vw; background: rgba(21, 21, 28, 0.72); border: 1px solid var(--hairline); }
      .prompt { max-width: 60%; font: 600 clamp(30px, 2.6vw, 70px)/1.15 var(--display); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .count { font: 700 clamp(72px, 6.25vw, 168px)/1 var(--display); font-variant-numeric: tabular-nums; color: var(--accent); }
      .credits { left: 5vw; right: 5vw; bottom: 5vh; display: flex; gap: 2vw; padding: 1vw 1.5vw; background: rgba(21, 21, 28, 0.72); border: 1px solid var(--hairline); font: 600 var(--fs-label)/1.3 var(--text); }
      .credits:empty { display: none; }
      .dial { display: flex; align-items: center; gap: 1vw; }
      .dot { width: 1.3vw; height: 1.3vw; border-radius: 50%; flex: none; }

      .card { left: 5vw; right: 45vw; top: 5vh; }
      .card .title { font: 700 var(--fs-h2)/1.05 var(--display); border-top: 1px solid var(--hairline); padding-top: 1vw; margin-top: 0.6vw; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .board { right: 5vw; top: 5vh; width: 36vw; bottom: 16vh; padding: 1.5vw; background: rgba(21, 21, 28, 0.72); border: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 1vw; box-sizing: border-box; }
      .sc { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0 1vw; opacity: 0; }
      .sc .num, .combined .num { font: 700 clamp(64px, 5.8vw, 156px)/1 var(--display); font-variant-numeric: tabular-nums; }
      .sc .cap { grid-column: 1 / 3; color: var(--text-secondary); font-size: var(--fs-body); }
      .combined { text-align: center; opacity: 0; }
      .combined .num { font-size: clamp(120px, 10.4vw, 280px); font-weight: 800; color: var(--accent); }
      #ui[data-s="reveal"] .sc { animation: stamp 320ms cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: calc(var(--i) * 400ms); }
      #ui[data-s="reveal"] .combined { animation: slam 260ms cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 1600ms; }
      @keyframes stamp { from { opacity: 0; transform: scale(1.15); } to { opacity: 1; transform: none; } }
      @keyframes slam { from { opacity: 0; transform: scale(1.3); } to { opacity: 1; transform: none; } }

      #msg { position: fixed; left: 5vw; top: 5vh; font: 600 var(--fs-h2) var(--display); }
      #bloom { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent) 35%, var(--text-primary)) 0%, transparent 70%); }
      #bloom.go { animation: bloom 900ms both; }
      @keyframes bloom { 0% { opacity: 0; transform: scale(0); } 35% { opacity: 0.55; } 100% { opacity: 0; transform: scale(2.8); } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui" data-s="">
      <div class="bar"><div class="prompt"></div><div class="count">0:00</div></div>
      <div class="credits"></div>
      <div class="card"><div class="small scene-card"></div><div class="title"></div></div>
      <div class="board">
        <div class="sc" style="--i: 0" data-k="author"><span class="small">Author's Taste</span><span class="num">--</span><span class="cap"></span></div>
        <div class="sc" style="--i: 1" data-k="ai"><span class="small">AI Match</span><span class="num">--</span><span class="cap"></span></div>
        <div class="sc" style="--i: 2" data-k="audience"><span class="small">Audience</span><span class="num">--</span><span class="cap"></span></div>
        <div class="combined" data-k="combined"><div class="num">--</div><div class="small">Combined</div></div>
      </div>
    </div>
    <div id="bloom"></div>
    <div id="msg"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
